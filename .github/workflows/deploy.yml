name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Bump this to bust the build cache when the output format changes.
  CACHE_VERSION: v1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache key includes CACHE_VERSION (top of file) and the generator script hash.
      # Bump CACHE_VERSION to force a full cache bust when the output format changes.
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            csv_graph_*.json
            site/diff_*.json
            site/data_diff_*.json
            site/data_diff_*/
            site/search_index.json
          key: build-${{ env.CACHE_VERSION }}-${{ hashFiles('generate_csv_graph.py') }}-${{ github.run_id }}
          restore-keys: |
            build-${{ env.CACHE_VERSION }}-${{ hashFiles('generate_csv_graph.py') }}-

      # Checkout only the submodules this build actually reads:
      #   1. versions whose cached graph hash doesn't match the commit in the git index
      #   2. the latest version — its CSV files are copied to site/ for serving
      #   3. BOTH sides of every diff pair being rebuilt — build_data_diff() reads raw
      #      rows from each side, and read_table_rows() returns None (not an error) on a
      #      missing file, so a skipped submodule silently yields an empty data diff.
      - name: Checkout stale submodules
        shell: python
        run: |
          import json, subprocess
          from pathlib import Path

          versions   = json.loads(Path('versions.json').read_text(encoding='utf-8'))
          latest_id  = versions[-1]['id'] if versions else None

          def index_hash(path):
              """Gitlink commit for a submodule, or None for a plain tracked directory."""
              r = subprocess.run(['git', 'ls-files', '-s', '--', path],
                                 capture_output=True, text=True)
              first = r.stdout.strip().split('\n')[0].split() if r.stdout.strip() else []
              # mode 160000 == gitlink; anything else is a directory of regular files
              return first[1] if len(first) >= 2 and first[0] == '160000' else None

          # Pass 1 — classify every version as stale or cached.
          stale, present = set(), {}
          for v in versions:
              vid, expected = v['id'], index_hash(v['path'])
              present[vid] = expected
              cached_hash = None
              graph_file  = Path(f'csv_graph_{vid}.json')
              if graph_file.exists():
                  try:
                      data = json.loads(graph_file.read_text(encoding='utf-8'))
                      cached_hash = data.get('metadata', {}).get('submodule_hash')
                  except Exception:
                      pass
              # expected is None for plain directories — always rebuilt, always present
              if expected is None or expected != cached_hash:
                  stale.add(vid)

          # Pass 2 — expand to both sides of each rebuilt diff pair, mirroring the
          # cache condition in generate_csv_graph.py.
          ids    = [v['id'] for v in versions]
          needed = set(stale)
          if latest_id:
              needed.add(latest_id)
          for a, b in zip(ids, ids[1:]):
              pair_cached = (a not in stale and b not in stale
                             and Path(f'site/diff_{a}_to_{b}.json').exists()
                             and Path(f'site/data_diff_{a}_to_{b}.json').exists())
              if not pair_cached:
                  needed.update((a, b))

          checked_out, skipped = 0, 0
          for v in versions:
              vid, path = v['id'], v['path']
              if present[vid] is None:
                  continue  # plain directory, already in the main checkout
              if vid not in needed:
                  print(f'  {vid}  cached ({present[vid][:8]})')
                  skipped += 1
                  continue
              reason = 'stale' if vid in stale else \
                       ('always-latest' if vid == latest_id else 'needed for diff')
              print(f'  {vid}  checking out ({reason})')
              subprocess.run(
                  ['git', 'submodule', 'update', '--init', '--depth=1', path],
                  check=True
              )
              checked_out += 1

          print(f'\n{checked_out} submodule(s) checked out, {skipped} skipped')

      - name: Generate graphs and diffs
        run: python generate_csv_graph.py

      - name: Save build cache
        uses: actions/cache/save@v4
        with:
          path: |
            csv_graph_*.json
            site/diff_*.json
            site/data_diff_*.json
            site/data_diff_*/
            site/search_index.json
          key: build-${{ env.CACHE_VERSION }}-${{ hashFiles('generate_csv_graph.py') }}-${{ github.run_id }}

      - name: Generate visualization
        run: python generate_viz.py

      # Reads metadata.root from the generated graph to handle both
      # csv/en (7.41+) and flat csv/ (pre-7.41) layouts automatically.
      - name: Copy latest CSV data into site
        shell: python
        run: |
          import json, shutil, pathlib
          root = json.loads(pathlib.Path('csv_graph_latest.json').read_text(encoding='utf-8'))['metadata']['root']
          src = pathlib.Path(root)
          dst = pathlib.Path('site') / root
          dst.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(src, dst)
          print(f"Copied {src} -> {dst}")

      # force_orphan replaces gh-pages with a single new commit on every
      # deploy — the branch never accumulates history.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
